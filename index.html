<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="fatal" hidden></div>
  <!-- Month title and the Prev / Today / Next buttons -->
  <header id="top">
    <h1 id="title"></h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">Prev</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">Next</button>
    </div>
  </header>

  <!-- Calendar tabs (filled in by script.js, SECTION 6) -->
  <nav class="tabs" id="tabs" role="tablist" aria-label="Calendars"></nav>
  <div class="tabtools" id="tabtools"></div>
  <!-- Settings tab: week start, theme, cell height, time format, holidays -->
  <section class="settings panel" id="settingsPanel" aria-label="Settings" hidden>
    <h2>Settings</h2>
    <label>Week starts on
      <select id="weekStart"><option value="0">Sunday</option><option value="1">Monday</option></select></label>
    <label>Theme
      <select id="theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <label>Cell height
      <select id="density"><option value="64">Compact</option><option value="96">Regular</option><option value="130">Roomy</option></select></label>
    <label>Time format
      <select id="timeFormat"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
    <label>Holidays
      <select id="holidays"><option value="off">None</option><option value="us">United States</option><option value="ca">Canada</option><option value="uk">United Kingdom</option></select></label>
  </section>
  <!-- The month grid (filled in by script.js, SECTION 4) -->
  <div class="grid" id="grid"></div>
</div>

<!-- Popup for a day: its events plus the add/edit event form -->
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <ul id="list"></ul>
  <div class="row">
    <label class="grow">Title <input type="text" id="evTitle" maxlength="60" placeholder="New event"></label>
  </div>
  <div class="row">
    <label>Calendar <select id="evCal"></select></label>
    <label>Last day <input type="date" id="evLast"></label>
    <label>Start <input type="time" id="evTime"></label>
    <label>End <input type="time" id="evEnd"></label>
    <label>Repeat
      <select id="evRepeat">
        <option value="none">Does not repeat</option><option value="daily">Every day</option>
        <option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option>
      </select></label>
    <label>Color <input type="color" id="evColor"></label>
  </div>
  <p class="hint">Leave the start time blank for an all-day event, and the last day blank for a one-day event. Edits and deletes apply to the whole event, including every day and every repeat.</p>
  <p id="err" role="alert" hidden></p>
  <div class="actions">
    <button id="close">Close</button>
    <button id="cancel" hidden>Cancel edit</button>
    <button class="primary" id="add">Add event</button>
  </div>
</dialog>

<!-- Popup for renaming, recoloring or deleting a calendar -->
<dialog id="calDlg">
  <h2 id="calTitle"></h2>
  <div class="row">
    <label class="grow">Name <input type="text" id="calName" maxlength="30"></label>
    <label>Color <input type="color" id="calColor"></label>
  </div>
  <label class="check" id="recolorRow" hidden><input type="checkbox" id="recolor" checked> Also recolor existing events that use the old color</label>
  <p id="calErr" role="alert" hidden></p>
  <div class="actions">
    <button class="danger" id="calDelete" hidden>Delete calendar</button>
    <button id="calCancel">Cancel</button>
    <button class="primary" id="calSave">Save</button>
  </div>
</dialog>

<!-- All the code that makes it work is in script.js -->
<script src="script.js"></script>
</body>
</html>
