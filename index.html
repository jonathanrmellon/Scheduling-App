<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1f6; --surface:#fff; --ink:#1b2433; --muted:#6b7587; --line:#d9dfe9; --accent:#1f8a70; --accent-ink:#fff; }
  :root[data-theme="dark"] { --bg:#12161f; --surface:#1b212d; --ink:#e8ecf4; --muted:#8e98ab; --line:#2b3342; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) { --bg:#12161f; --surface:#1b212d; --ink:#e8ecf4; --muted:#8e98ab; --line:#2b3342; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Bricolage Grotesque", system-ui, sans-serif; padding:24px 16px 48px; }
  .wrap { max-width:960px; margin:0 auto; }
  header { display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:16px; margin-bottom:20px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,3.4rem); font-weight:800; letter-spacing:-0.03em; line-height:1; }
  h1 span { color:var(--muted); font-weight:400; }
  .nav { display:flex; gap:8px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:8px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #fatal { background:#fde8e8; color:#8a1c1c; border:1px solid #f3b4b4; border-radius:10px; padding:12px 16px; margin-bottom:16px; }

  .settings { display:flex; flex-wrap:wrap; gap:16px 20px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:20px; font-size:0.9rem; }
  .settings label { display:flex; align-items:center; gap:8px; color:var(--muted); }
  select, input[type="text"], input[type="time"], input[type="color"] { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  input[type="color"] { padding:2px; width:40px; height:32px; cursor:pointer; }
  .swatches { display:flex; gap:6px; }
  .swatch { width:24px; height:24px; border-radius:50%; padding:0; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); }

  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .dow { background:var(--surface); padding:10px 8px; font-size:0.8rem; color:var(--muted); text-align:center; font-weight:600; }
  .day { background:var(--surface); min-height:96px; padding:6px; text-align:left; border:0; border-radius:0; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .day:hover { background:var(--bg); }
  .day.other { opacity:0.4; }
  .num { font-weight:600; font-size:0.9rem; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; }
  .day.today .num { background:var(--accent); color:var(--accent-ink); }
  .ev { font-size:0.72rem; padding:2px 6px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { font-size:0.72rem; color:var(--muted); padding-left:2px; }

  dialog { border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); width:min(460px,94vw); padding:20px; }
  dialog::backdrop { background:rgba(10,14,22,0.55); }
  dialog h2 { margin:0 0 12px; font-size:1.2rem; }
  ul { list-style:none; margin:0 0 14px; padding:0; max-height:36vh; overflow-y:auto; }
  li { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  li .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  li .main { flex:1; min-width:0; }
  li .t { overflow-wrap:anywhere; }
  li .meta { color:var(--muted); font-size:0.82rem; }
  li button { padding:3px 10px; font-size:0.82rem; }
  .empty { color:var(--muted); font-size:0.9rem; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .row label { display:flex; flex-direction:column; gap:4px; font-size:0.8rem; color:var(--muted); }
  .row .grow { flex:1; min-width:150px; }
  .row .grow input { width:100%; }
  .hint { color:var(--muted); font-size:0.82rem; margin:0 0 12px; }
  #err { color:#b42318; font-size:0.88rem; margin:0 0 12px; }
  .actions { display:flex; justify-content:flex-end; gap:8px; }

  @media (max-width:600px) {
    .day { min-height:64px; padding:3px; }
    .ev, .more { font-size:0.62rem; padding:1px 3px; }
    .dow { padding:8px 2px; font-size:0.7rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="fatal" hidden></div>
  <header>
    <h1 id="title"></h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">Prev</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">Next</button>
    </div>
  </header>

  <section class="settings" aria-label="Calendar settings">
    <label>Accent <span class="swatches" id="swatches"></span>
      <input type="color" id="accent" aria-label="Custom accent color"></label>
    <label>Week starts on
      <select id="weekStart"><option value="0">Sunday</option><option value="1">Monday</option></select></label>
    <label>Theme
      <select id="theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <label>Cell height
      <select id="density"><option value="64">Compact</option><option value="96">Regular</option><option value="130">Roomy</option></select></label>
    <label>Time format
      <select id="timeFormat"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
  </section>

  <div class="grid" id="grid"></div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <ul id="list"></ul>
  <div class="row">
    <label class="grow">Title <input type="text" id="evTitle" maxlength="60" placeholder="New event"></label>
  </div>
  <div class="row">
    <label>Start <input type="time" id="evTime"></label>
    <label>End <input type="time" id="evEnd"></label>
    <label>Repeat
      <select id="evRepeat">
        <option value="none">Does not repeat</option><option value="daily">Every day</option>
        <option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option>
      </select></label>
    <label>Color <input type="color" id="evColor"></label>
  </div>
  <p class="hint">Leave the start time blank for an all-day event. Edits and deletes apply to every repeat of a repeating event.</p>
  <p id="err" role="alert" hidden></p>
  <div class="actions">
    <button id="close">Close</button>
    <button id="cancel" hidden>Cancel edit</button>
    <button class="primary" id="add">Add event</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PRESETS = ["#1f8a70","#3b6fd4","#c2410c","#9333ea","#be185d","#475569"];
const REPEATS = { none:"", daily:"repeats every day", weekly:"repeats every week", monthly:"repeats every month", yearly:"repeats every year" };
const MAXCHIPS = { 64:2, 96:3, 130:5 };

// Show a visible message instead of a silent blank page if something breaks
window.addEventListener("error", e => {
  const f = $("fatal"); f.hidden = false;
  f.textContent = "Something went wrong: " + e.message + ". Try a hard refresh (Ctrl+Shift+R), and make sure the whole file was uploaded.";
});
// Older browsers without <dialog> support
if (!$("dlg").showModal) {
  $("dlg").showModal = function () { this.setAttribute("open", ""); };
  $("dlg").close = function () { this.removeAttribute("open"); };
}

let state = { accent: PRESETS[0], weekStart: 0, theme: "auto", density: 96, timeFormat: "12", items: [], nextId: 1 };
try { Object.assign(state, JSON.parse(localStorage.getItem("calendar-state") || "{}")); } catch (e) {}
// Convert events saved by earlier versions of this calendar
if (state.events) {
  Object.keys(state.events).forEach(k => state.events[k].forEach(ev => {
    state.items.push({ id: state.nextId++, title: ev.title, date: k, time: ev.time || "", end: "", color: ev.color, repeat: "none" });
  }));
  delete state.events;
}
const save = () => { try { localStorage.setItem("calendar-state", JSON.stringify(state)); } catch (e) {} };

let view = new Date(); view.setDate(1);
let selected = null, editingId = null;

const pad = n => String(n).padStart(2, "0");
const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseKey = k => { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const inkFor = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 160 ? "#111" : "#fff"; };

function fmt(t) {
  if (!t) return "";
  if (state.timeFormat === "24") return t;
  const p = t.split(":").map(Number);
  return (p[0] % 12 || 12) + ":" + pad(p[1]) + (p[0] < 12 ? "am" : "pm");
}
const timeText = it => it.time ? fmt(it.time) + (it.end ? " to " + fmt(it.end) : "") : "All day";

// Does this event happen on day d?
function occursOn(it, d) {
  const s = parseKey(it.date);
  if (dayNum(d) < dayNum(s)) return false;
  if (it.repeat === "daily") return true;
  if (it.repeat === "weekly") return (dayNum(d) - dayNum(s)) % 7 === 0;
  if (it.repeat === "monthly" || it.repeat === "yearly") {
    const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    if (d.getDate() !== Math.min(s.getDate(), dim)) return false; // 31st lands on the last day of short months
    return it.repeat === "monthly" || d.getMonth() === s.getMonth();
  }
  return it.date === key(d);
}
const eventsOn = d => state.items.filter(it => occursOn(it, d)).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

function applySettings() {
  const r = document.documentElement;
  r.style.setProperty("--accent", state.accent);
  r.style.setProperty("--accent-ink", inkFor(state.accent));
  if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  $("accent").value = state.accent; $("weekStart").value = state.weekStart; $("theme").value = state.theme;
  $("density").value = state.density; $("timeFormat").value = state.timeFormat;
}

function render() {
  $("title").innerHTML = MONTHS[view.getMonth()] + " <span>" + view.getFullYear() + "</span>";
  const grid = $("grid"); grid.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const h = document.createElement("div"); h.className = "dow"; h.textContent = DOWS[(i + state.weekStart) % 7]; grid.appendChild(h);
  }
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const offset = (first.getDay() - state.weekStart + 7) % 7;
  const start = new Date(first); start.setDate(1 - offset);
  const dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7);
  const todayKey = key(new Date());
  const max = MAXCHIPS[state.density] || 3;

  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const cell = document.createElement("button");
    cell.className = "day" + (d.getMonth() !== view.getMonth() ? " other" : "") + (key(d) === todayKey ? " today" : "");
    cell.style.minHeight = state.density + "px";
    cell.setAttribute("aria-label", d.toDateString());
    cell.innerHTML = '<span class="num">' + d.getDate() + "</span>";
    const evs = eventsOn(d);
    evs.slice(0, max).forEach(it => {
      const e = document.createElement("div");
      e.className = "ev"; e.style.background = it.color; e.style.color = inkFor(it.color);
      e.textContent = (it.repeat !== "none" ? "\u21BB " : "") + (it.time ? fmt(it.time) + " " : "") + it.title;
      cell.appendChild(e);
    });
    if (evs.length > max) { const m = document.createElement("div"); m.className = "more"; m.textContent = "+" + (evs.length - max) + " more"; cell.appendChild(m); }
    cell.onclick = () => openDay(d);
    grid.appendChild(cell);
  }
}

function showErr(msg) { const e = $("err"); e.textContent = msg; e.hidden = !msg; }

function resetForm() {
  editingId = null;
  $("evTitle").value = ""; $("evTime").value = ""; $("evEnd").value = "";
  $("evRepeat").value = "none"; $("evColor").value = state.accent;
  $("add").textContent = "Add event"; $("cancel").hidden = true; showErr("");
}

function openDay(d) {
  selected = key(d);
  $("dlgTitle").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  resetForm(); renderList();
  $("dlg").showModal(); $("evTitle").focus();
}

function renderList() {
  const list = $("list"); list.innerHTML = "";
  const evs = eventsOn(parseKey(selected));
  if (!evs.length) { list.innerHTML = '<li class="empty">Nothing planned. Add an event below.</li>'; return; }
  evs.forEach(it => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="dot"></span><div class="main"><div class="t"></div><div class="meta"></div></div>' +
      '<button class="edit">Edit</button><button class="del">Delete</button>';
    li.querySelector(".dot").style.background = it.color;
    li.querySelector(".t").textContent = it.title;
    li.querySelector(".meta").textContent = timeText(it) + (REPEATS[it.repeat] ? ", " + REPEATS[it.repeat] : "");
    li.querySelector(".edit").onclick = () => startEdit(it);
    li.querySelector(".del").onclick = () => {
      if (it.repeat !== "none" && !confirm("Delete this event and all of its repeats?")) return;
      state.items = state.items.filter(x => x.id !== it.id);
      if (editingId === it.id) resetForm();
      save(); renderList(); render();
    };
    list.appendChild(li);
  });
}

function startEdit(it) {
  editingId = it.id; showErr("");
  $("evTitle").value = it.title; $("evTime").value = it.time || ""; $("evEnd").value = it.end || "";
  $("evRepeat").value = it.repeat; $("evColor").value = it.color;
  $("add").textContent = "Save changes"; $("cancel").hidden = false; $("evTitle").focus();
}

function submit() {
  const title = $("evTitle").value.trim(), time = $("evTime").value, end = $("evEnd").value;
  if (!title) { showErr("Enter a title for the event."); $("evTitle").focus(); return; }
  if (end && !time) { showErr("Set a start time before setting an end time."); return; }
  if (end && end <= time) { showErr("The end time must be after the start time."); return; }
  const data = { title: title, time: time, end: end, color: $("evColor").value, repeat: $("evRepeat").value };
  if (editingId) Object.assign(state.items.find(x => x.id === editingId), data);
  else state.items.push(Object.assign({ id: state.nextId++, date: selected }, data));
  save(); resetForm(); renderList(); render();
}

$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$("today").onclick = () => { view = new Date(); view.setDate(1); render(); };
$("add").onclick = submit;
$("cancel").onclick = () => { resetForm(); $("evTitle").focus(); };
$("close").onclick = () => $("dlg").close();
$("evTitle").onkeydown = e => { if (e.key === "Enter") submit(); };
$("accent").oninput = e => { state.accent = e.target.value; save(); applySettings(); };
$("weekStart").onchange = e => { state.weekStart = +e.target.value; save(); render(); };
$("theme").onchange = e => { state.theme = e.target.value; save(); applySettings(); };
$("density").onchange = e => { state.density = +e.target.value; save(); render(); };
$("timeFormat").onchange = e => { state.timeFormat = e.target.value; save(); render(); };

PRESETS.forEach(c => {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = c; b.setAttribute("aria-label", "Accent " + c);
  b.onclick = () => { state.accent = c; save(); applySettings(); };
  $("swatches").appendChild(b);
});

applySettings();
render();
</script>
</body>
</html>
